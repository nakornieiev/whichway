[package]
name = "whichway"
version = "0.1.0"
edition = "2024"
description = "Read-only CLI that explains why a shell command resolves to a specific binary."
authors = ["nakornieiev"]
license = "MIT"
repository = "https://github.com/nakornieiev/whichway"
readme = "README.md"
keywords = ["cli", "path", "shell", "devtools", "diagnostics"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = "z"
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
allow-dirty = ["ci"]
